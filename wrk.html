<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate Log">
<meta name="theme-color" content="#1c1917">
<title>Plate Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1917;
    --surface:#262220;
    --surface-raised:#302b28;
    --chalk:#f2ece2;
    --chalk-dim:#a89e93;
    --line:#3c3532;
    --brass:#d9a441;
    --brass-dim:#8a6a2c;
    --olive:#7c8c5a;
    --rust:#b6553a;
    --radius:14px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  ::selection{background:var(--brass); color:var(--ink);}

  /* HERO */
  .hero{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:var(--ink);
  }
  .hero-top{display:flex; align-items:baseline; justify-content:space-between;}
  .wordmark{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px;
    letter-spacing:1px;
    color:var(--chalk);
    line-height:1;
  }
  .wordmark span{color:var(--brass);}
  .stats-line{
    font-size:12.5px;
    color:var(--chalk-dim);
    margin-top:4px;
  }
  .stats-line b{color:var(--chalk); font-weight:600;}

  .day-tabs{
    display:flex;
    gap:8px;
    margin-top:16px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:9px 15px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--chalk-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .day-tab .num{color:var(--brass-dim); margin-right:5px; font-family:'Bebas Neue'; font-size:15px;}
  .day-tab.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
  }
  .day-tab.active .num{color:var(--ink); opacity:.55;}

  /* DAY HEADER */
  .day-header{
    padding:20px 20px 4px;
  }
  .day-header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:.5px;
    margin:0 0 2px;
    font-weight:400;
  }
  .day-header p{
    margin:0;
    font-size:13px;
    color:var(--chalk-dim);
  }

  .content{padding:14px 16px 0;}

  /* EXERCISE CARD */
  .exercise{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .exercise-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 10px;
  }
  .exercise-name{
    font-size:15.5px;
    font-weight:700;
    color:var(--chalk);
  }
  .exercise-target{
    font-size:12px;
    color:var(--brass);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    margin-left:10px;
  }

  .sets{padding:0 12px 12px;}
  .set-row{
    display:grid;
    grid-template-columns:26px 1fr 1fr 34px;
    gap:8px;
    align-items:center;
    padding:6px 4px;
  }
  .set-idx{
    font-family:'Bebas Neue';
    font-size:15px;
    color:var(--chalk-dim);
    text-align:center;
  }
  .set-row.done .set-idx{color:var(--olive);}
  .field{position:relative;}
  .field input{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--chalk);
    font-size:15px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    padding:9px 8px 9px 8px;
    text-align:center;
    font-family:'Inter',sans-serif;
  }
  .field input::placeholder{color:#5f574f; font-weight:500;}
  .field input:focus{outline:none; border-color:var(--brass);}
  .field .unit{
    position:absolute;
    right:9px; top:50%; transform:translateY(-50%);
    font-size:10px; color:var(--chalk-dim); pointer-events:none;
  }
  .field.has-unit input{padding-right:24px;}

  .check-btn{
    width:34px; height:34px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--chalk-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:15px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .check-btn.on{
    background:var(--olive);
    border-color:var(--olive);
    color:var(--ink);
  }

  .last-hint{
    font-size:11px;
    color:var(--chalk-dim);
    padding:2px 4px 8px;
    opacity:.75;
  }

  /* FOOTER */
  .footer-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--ink) 60%, transparent);
    z-index:30;
  }
  .finish-btn{
    width:100%;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:var(--radius);
    padding:15px;
    font-size:15px;
    font-weight:800;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .finish-btn:active{transform:scale(.98);}
  .finish-btn.saved{background:var(--olive);}

  .toast{
    position:fixed;
    top:16px; left:50%;
    transform:translateX(-50%) translateY(-60px);
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    z-index:100;
    transition:transform .25s ease;
    pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  .history-btn{
    text-align:center;
    color:var(--chalk-dim);
    font-size:12.5px;
    padding:10px 0 20px;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:var(--line);
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:200;
    display:none;
    align-items:flex-end;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    width:100%;
    max-height:75vh;
    overflow-y:auto;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .modal h2{
    font-family:'Bebas Neue';
    font-weight:400;
    font-size:22px;
    margin:0 0 12px;
  }
  .hist-entry{
    border-bottom:1px solid var(--line);
    padding:10px 0;
    font-size:13px;
  }
  .hist-entry .hd{display:flex; justify-content:space-between; color:var(--chalk-dim); margin-bottom:4px;}
  .hist-entry .hd b{color:var(--chalk);}
  .modal-close{
    display:block;
    margin:16px auto 0;
    background:none;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    padding:9px 22px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div class="wordmark">PLATE<span>LOG</span></div>
  </div>
  <div class="stats-line" id="statsLine">Loading…</div>
  <div class="day-tabs" id="dayTabs"></div>
</div>

<div class="day-header" id="dayHeader"></div>
<div class="content" id="content"></div>
<div class="history-btn" id="historyBtn">view history</div>

<div class="footer-bar">
  <button class="finish-btn" id="finishBtn">Finish workout</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>History</h2>
    <div id="historyList"></div>
    <button class="modal-close" id="modalClose">Close</button>
  </div>
</div>

<script>
// Persistent storage backed by the browser's localStorage — works fully offline
// once the page is installed on the phone, and survives closing the app.
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : {key, value: v};
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted: true};
  },
  async list(prefix){
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return {keys};
  }
};

const PROGRAM = {
  day1: {
    label: "Day 1", num:"01",
    title: "Back Width + Biceps + Side Delts",
    exercises: [
      {name:"Pull-ups", sets:3, rep:"6–10"},
      {name:"Chest-Supported Row", sets:2, rep:"8–12"},
      {name:"Cable Lat Prayer / Straight-Arm Pulldown", sets:2, rep:"10–15"},
      {name:"Cable/Dumbbell Lateral Raise", sets:3, rep:"12–20"},
      {name:"Incline Dumbbell Curl", sets:3, rep:"8–12"},
      {name:"Hammer Curl", sets:2, rep:"10–15"},
    ]
  },
  day2: {
    label: "Day 2", num:"02",
    title: "Legs + Serratus",
    exercises: [
      {name:"Squat / Leg Press", sets:3, rep:"6–10"},
      {name:"Romanian Deadlift", sets:3, rep:"8–12"},
      {name:"Leg Extension", sets:2, rep:"10–15"},
      {name:"Leg Curl", sets:2, rep:"10–15"},
      {name:"Calf Raise", sets:3, rep:"10–15"},
      {name:"Cable Serratus Punch", sets:2, rep:"12–20"},
      {name:"Cable Crunch", sets:2, rep:"10–15"},
    ]
  },
  day4: {
    label: "Day 4", num:"04",
    title: "Shoulders + Chest + Triceps",
    exercises: [
      {name:"Shoulder Press", sets:3, rep:"6–10"},
      {name:"Cable/Dumbbell Lateral Raise", sets:4, rep:"12–20"},
      {name:"Reverse Pec Deck", sets:3, rep:"12–20"},
      {name:"Incline Bench Press", sets:3, rep:"6–10"},
      {name:"Cable Fly", sets:2, rep:"10–15"},
      {name:"Overhead Cable Triceps Extension", sets:3, rep:"10–15"},
      {name:"Triceps Pushdown", sets:2, rep:"10–15"},
    ]
  },
  day5: {
    label: "Day 5", num:"05",
    title: "Back + Arms + Legs",
    exercises: [
      {name:"Lat Pulldown / Pull-ups", sets:3, rep:"8–12"},
      {name:"Seated Cable Row", sets:3, rep:"8–12"},
      {name:"One-Arm Cable Lat Row", sets:2, rep:"10–15"},
      {name:"Leg Press", sets:3, rep:"8–12"},
      {name:"Leg Curl", sets:2, rep:"10–15"},
      {name:"EZ-Bar Curl", sets:3, rep:"8–12"},
      {name:"Triceps Pushdown", sets:3, rep:"10–15"},
      {name:"Lateral Raise", sets:2, rep:"15–20"},
    ]
  }
};
const DAY_KEYS = Object.keys(PROGRAM);

let currentDay = DAY_KEYS[0];
let draft = {}; // { exIdx: [{w,r,done}, ...] }
let lastData = {}; // { exIdx: [{w,r}, ...] }
let allLogs = []; // {day,date,label}

function emptySets(count){
  return Array.from({length:count}, () => ({w:"", r:"", done:false}));
}

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

async function loadDay(day){
  const prog = PROGRAM[day];
  draft = {};
  prog.exercises.forEach((ex, i) => { draft[i] = emptySets(ex.sets); });
  lastData = {};

  try{
    const d = await storage.get(`draft:${day}`, false);
    if(d && d.value){
      const parsed = JSON.parse(d.value);
      prog.exercises.forEach((ex,i) => {
        if(parsed[i]) draft[i] = parsed[i];
      });
    }
  }catch(e){}

  await Promise.all(prog.exercises.map(async (ex,i) => {
    try{
      const l = await storage.get(`last:${day}:${i}`, false);
      if(l && l.value) lastData[i] = JSON.parse(l.value);
    }catch(e){}
  }));
}

async function saveDraft(day){
  try{ await storage.set(`draft:${day}`, JSON.stringify(draft), false); }
  catch(e){ console.error("draft save failed", e); }
}

async function loadStats(){
  try{
    const res = await storage.list("log:", false);
    allLogs = (res && res.keys ? res.keys : []).map(k => {
      const parts = k.split(":"); // log:day:date
      return {key:k, day:parts[1], date:parts[2]};
    }).sort((a,b) => b.date.localeCompare(a.date));
  }catch(e){ allLogs = []; }
  renderStats();
}

function renderStats(){
  const el = document.getElementById("statsLine");
  if(allLogs.length === 0){
    el.innerHTML = `<b>0</b> workouts logged — let's start one`;
    return;
  }
  const last = allLogs[0];
  const daysAgo = Math.round((Date.now() - new Date(last.date)) / 86400000);
  const when = daysAgo === 0 ? "today" : daysAgo === 1 ? "yesterday" : `${daysAgo}d ago`;
  el.innerHTML = `<b>${allLogs.length}</b> workouts logged · last: <b>${PROGRAM[last.day]?.label || last.day}</b> ${when}`;
}

function renderTabs(){
  const el = document.getElementById("dayTabs");
  el.innerHTML = "";
  DAY_KEYS.forEach(k => {
    const btn = document.createElement("button");
    btn.className = "day-tab" + (k === currentDay ? " active" : "");
    btn.innerHTML = `<span class="num">${PROGRAM[k].num}</span>${PROGRAM[k].label}`;
    btn.onclick = () => switchDay(k);
    el.appendChild(btn);
  });
}

function renderDayHeader(){
  const prog = PROGRAM[currentDay];
  document.getElementById("dayHeader").innerHTML = `
    <h1>${prog.label} — ${prog.title}</h1>
    <p>${prog.exercises.length} exercises · tap a set to log it</p>
  `;
}

function renderExercises(){
  const prog = PROGRAM[currentDay];
  const el = document.getElementById("content");
  el.innerHTML = "";

  prog.exercises.forEach((ex, i) => {
    const card = document.createElement("div");
    card.className = "exercise";

    const head = document.createElement("div");
    head.className = "exercise-head";
    head.innerHTML = `
      <div class="exercise-name">${ex.name}</div>
      <div class="exercise-target">${ex.sets} × ${ex.rep}</div>
    `;
    card.appendChild(head);

    const setsWrap = document.createElement("div");
    setsWrap.className = "sets";

    const last = lastData[i];
    if(last && last.length){
      const summary = last.filter(s => s.w || s.r).map(s => `${s.w||"–"}kg×${s.r||"–"}`).join(", ");
      if(summary){
        const hint = document.createElement("div");
        hint.className = "last-hint";
        hint.textContent = `last time: ${summary}`;
        setsWrap.appendChild(hint);
      }
    }

    draft[i].forEach((setVal, si) => {
      const row = document.createElement("div");
      row.className = "set-row" + (setVal.done ? " done" : "");

      const idx = document.createElement("div");
      idx.className = "set-idx";
      idx.textContent = si + 1;
      row.appendChild(idx);

      const wField = document.createElement("div");
      wField.className = "field has-unit";
      const wInput = document.createElement("input");
      wInput.type = "number"; wInput.inputMode = "decimal"; wInput.min = "0";
      wInput.placeholder = last && last[si] && last[si].w ? String(last[si].w) : "0";
      wInput.value = setVal.w;
      wInput.oninput = (e) => { draft[i][si].w = e.target.value; saveDraft(currentDay); };
      wField.appendChild(wInput);
      const wUnit = document.createElement("span");
      wUnit.className = "unit"; wUnit.textContent = "kg";
      wField.appendChild(wUnit);
      row.appendChild(wField);

      const rField = document.createElement("div");
      rField.className = "field has-unit";
      const rInput = document.createElement("input");
      rInput.type = "number"; rInput.inputMode = "numeric"; rInput.min = "0";
      rInput.placeholder = last && last[si] && last[si].r ? String(last[si].r) : ex.rep.split("–")[0];
      rInput.value = setVal.r;
      rInput.oninput = (e) => { draft[i][si].r = e.target.value; saveDraft(currentDay); };
      rField.appendChild(rInput);
      const rUnit = document.createElement("span");
      rUnit.className = "unit"; rUnit.textContent = "reps";
      rField.appendChild(rUnit);
      row.appendChild(rField);

      const checkBtn = document.createElement("button");
      checkBtn.className = "check-btn" + (setVal.done ? " on" : "");
      checkBtn.textContent = "✓";
      checkBtn.onclick = () => {
        draft[i][si].done = !draft[i][si].done;
        saveDraft(currentDay);
        renderExercises();
      };
      row.appendChild(checkBtn);

      setsWrap.appendChild(row);
    });

    card.appendChild(setsWrap);
    el.appendChild(card);
  });
}

async function switchDay(day){
  currentDay = day;
  renderTabs();
  renderDayHeader();
  document.getElementById("finishBtn").classList.remove("saved");
  document.getElementById("finishBtn").textContent = "Finish workout";
  await loadDay(day);
  renderExercises();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

async function finishWorkout(){
  const prog = PROGRAM[currentDay];
  const date = todayISO();
  const payload = {
    day: currentDay,
    label: prog.label,
    title: prog.title,
    date,
    exercises: prog.exercises.map((ex,i) => ({
      name: ex.name,
      sets: draft[i]
    }))
  };

  try{
    await storage.set(`log:${currentDay}:${date}`, JSON.stringify(payload), false);
    await Promise.all(prog.exercises.map((ex,i) =>
      storage.set(`last:${currentDay}:${i}`, JSON.stringify(draft[i]), false)
    ));
    await storage.delete(`draft:${currentDay}`, false).catch(()=>{});

    const btn = document.getElementById("finishBtn");
    btn.classList.add("saved");
    btn.textContent = "Saved ✓";
    showToast("Workout logged");
    await loadStats();
  }catch(e){
    console.error(e);
    showToast("Couldn't save — try again");
  }
}

async function openHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = allLogs.length ? "" : `<p style="color:var(--chalk-dim); font-size:13px;">No workouts logged yet.</p>`;

  for(const entry of allLogs.slice(0, 20)){
    try{
      const res = await storage.get(entry.key, false);
      if(!res || !res.value) continue;
      const data = JSON.parse(res.value);
      const div = document.createElement("div");
      div.className = "hist-entry";
      const doneSets = data.exercises.reduce((acc,ex) => acc + ex.sets.filter(s=>s.done).length, 0);
      div.innerHTML = `
        <div class="hd"><b>${data.label}</b><span>${data.date}</span></div>
        <div style="color:var(--chalk-dim)">${data.title} · ${doneSets} sets completed</div>
      `;
      list.appendChild(div);
    }catch(e){}
  }
  document.getElementById("modalOverlay").classList.add("show");
}

document.getElementById("finishBtn").onclick = finishWorkout;
document.getElementById("historyBtn").onclick = openHistory;
document.getElementById("modalClose").onclick = () => document.getElementById("modalOverlay").classList.remove("show");
document.getElementById("modalOverlay").onclick = (e) => {
  if(e.target.id === "modalOverlay") document.getElementById("modalOverlay").classList.remove("show");
};

(async function init(){
  renderTabs();
  renderDayHeader();
  await loadDay(currentDay);
  renderExercises();
  await loadStats();
})();
</script>
</body>
</html>
